[package]
name = "milan-pro"
version = "0.5.0"
edition = "2024"
description = "Professional nonlinear video editor inspired by VEGAS Pro"
license = "MIT"
authors = ["MeridianNLE Contributors"]

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
# R9: the audio device layer (playback, recording, input monitoring). Already in Cargo.lock (it came with rodio).
cpal = "0.15.3"
png = "0.18"  # screenshot harness (already in the tree via eframe)
# Updater (src/updater.rs): small blocking HTTPS client (rustls, no OpenSSL) and SHA-256 of the installer.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# src/engine/vdecode.rs: decoder pipes read straight into Color32 frames. Already in Cargo.lock (via egui).
bytemuck = "1"
# src/engine/generate.rs: Titles & Text glyph outlines. Already in Cargo.lock (via epaint).
ab_glyph = "0.2"

# src/proc.rs: Job Object that kills ffmpeg children with Milan; src/app/drop.rs: cursor during a drag from Windows.
# Already in Cargo.lock (via other crates). R14: src/ui/monitors.rs lists the displays, their DPI, the cursor and buttons.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# src/wasapi.rs (R9): the WASAPI exclusive output, which cpal 0.15 lacks. The version and features cpal already uses.
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Security", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
# build.rs: the exe's icon and version resource (MIT). Does nothing for non-Windows targets.
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
