[package]
name = "milan-pro"
version = "0.1.0"
edition = "2024"
description = "Professional nonlinear video editor inspired by VEGAS Pro"
license = "MIT"
authors = ["MeridianNLE Contributors"]

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
rodio = { version = "0.20.1", default-features = false }
png = "0.18"  # screenshot harness (already in the tree via eframe)
# Updater (src/updater.rs): small blocking HTTPS client (rustls, no OpenSSL) and SHA-256 of the installer.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
