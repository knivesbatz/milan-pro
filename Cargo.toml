[package]
name = "milan-pro"
version = "0.7.0"
edition = "2024"
description = "Professional nonlinear video editor inspired by VEGAS Pro"
license = "MIT"
authors = ["MeridianNLE Contributors"]

# R21a: the UI's painter. `wgpu` (default) paints through wgpu on Vulkan and shares its device with the GPU
# compositor (`src/engine/gpu`), so a preview frame never leaves the GPU (R21c). `glow` keeps eframe's OpenGL
# painter: the compositor then opens its own device and reads every frame back. `--no-default-features --features glow`.
[features]
default = ["wgpu"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]

[dependencies]
# eframe's own defaults less its `glow` painter, which is a feature of this crate (above).
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# R29: src/interchange/xml.rs reads FCP7 XML and FCPXML. Already in Cargo.lock (via other crates); MIT.
quick-xml = "0.41"
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
# R9: the audio device layer (playback, recording, input monitoring). Already in Cargo.lock (it came with rodio).
cpal = "0.15.3"
png = "0.18"  # screenshot harness (already in the tree via eframe)
# Updater (src/updater.rs): small blocking HTTPS client (rustls, no OpenSSL) and SHA-256 of the installer.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# R46: minisign signature verification of the update checksum (MIT, no dependencies).
minisign-verify = "0.3"
# R44: the log facade; src/log.rs is the file logger behind it.
log = "0.4"
# src/engine/vdecode.rs: decoder pipes read straight into Color32 frames. Already in Cargo.lock (via egui).
bytemuck = "1"
# src/engine/generate.rs: Titles & Text glyph outlines. Already in Cargo.lock (via epaint).
ab_glyph = "0.2"
# R21a: src/engine/gpu, the GPU compositor on Vulkan. The version eframe's wgpu painter uses; the default dx12
# feature would add gpu-allocator, which is not in Cargo.lock, so only the Vulkan (and GL, unused) backends are built.
wgpu = { version = "24.0.5", default-features = false, features = ["wgsl"] }

# milan-plugin-host.exe loads OFX plug-in binaries (ISC). Already in Cargo.lock (via glutin and others); MilanPro.exe
# never calls it: it runs no plug-in code.
libloading = "0.8"
# R34a/R35: milan-plugin-host.exe hosts VST3 (coupler-rs bindings, MIT OR Apache-2.0; not the GPL vst3-sys) and CLAP
# (MIT OR Apache-2.0) audio effects. MilanPro.exe never calls them. Plug-in state blobs travel as base64 (in the lock).
vst3 = "0.3"
clap-sys = "0.6"
base64 = "0.23"

# src/proc.rs: Job Object that kills ffmpeg children with Milan; src/app/drop.rs: cursor during a drag from Windows.
# Already in Cargo.lock (via other crates). R14: src/ui/monitors.rs lists the displays, their DPI, the cursor and buttons.
# src/overlays.rs: Remove Pack moves a pack folder to the Recycle Bin (SHFileOperationW, Win32_UI_Shell).
# R44: src/log.rs writes minidumps (Win32_System_Diagnostics_Debug, Win32_System_Kernel) and the diagnostic report reads
# memory and CPU (Win32_System_SystemInformation) and the GPU through DXGI (the `windows` crate below).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ErrorReporting", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_Media_DxMediaObjects", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# src/wasapi.rs (R9): the WASAPI exclusive output, which cpal 0.15 lacks. The version and features cpal already uses.
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Security", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem"] }

# R32: the OFX plug-in host, a second executable installed beside MilanPro.exe (installer/milan-pro.iss).
[[bin]]
name = "milan-pro"
path = "src/main.rs"

[[bin]]
name = "milan-plugin-host"
path = "src/bin/milan-plugin-host/main.rs"

[build-dependencies]
# build.rs: the exe's icon and version resource (MIT). Does nothing for non-Windows targets.
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
