[package]
name = "milan-pro"
version = "0.1.0"
edition = "2024"
description = "Professional nonlinear video editor inspired by VEGAS Pro"
license = "MIT"
authors = ["MeridianNLE Contributors"]

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
rodio = { version = "0.20.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
