name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          # The app compares releases with its own Cargo version; a mismatch would offer the same update forever.
          $cargo = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$cargo" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $cargo" }
      # Builds both executables: MilanPro (milan-pro.exe) and the OFX plug-in host (milan-plugin-host.exe).
      - run: cargo build --release
      - run: choco install innosetup -y --no-progress
      - run: ./installer/fetch-ffmpeg.ps1
        shell: pwsh
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\milan-pro.iss
      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem release\MilanPro-*-Setup.exe
          # Checksum the in-app updater falls back to when the API gives no asset digest (sha256sum format, LF).
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          $sha = "$($setup.FullName).sha256"
          [IO.File]::WriteAllText($sha, "$hash  $($setup.Name)`n")
          # A draft until both files are up: a published release without its Setup.exe is what update checks see.
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --draft --title "Milan Pro ${{ github.ref_name }}" --generate-notes }
          gh release upload "${{ github.ref_name }}" $setup.FullName $sha --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload failed: the release stays a draft" }
          gh release edit "${{ github.ref_name }}" --draft=false
